name: CD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: infra/docker/api.Dockerfile
          - service: dashboard
            dockerfile: infra/docker/dashboard.Dockerfile
          - service: worker
            dockerfile: infra/docker/worker.Dockerfile
          - service: mlflow
            dockerfile: infra/docker/mlflow.Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract tag name
        id: meta
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "repo=ghcr.io/${{ github.repository_owner }}/retailpulse-${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442f84e17ed00d034d465245366f86cc4 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH & Smoke Test
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1643c72a819c9eeb135f606346743ae841bc6838 # v5.1.0
        with:
          enable-cache: true
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Configure SSH Key
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to Remote Host (compose pull and up)
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" << 'EOF'
            set -euo pipefail
            cd /opt/retailpulse
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          EOF

      - name: Run Smoke Test against Deployed Instance
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL || 'http://localhost' }}
          SMOKE_USER: ${{ secrets.SMOKE_TEST_USER || 'admin@retailpulse.local' }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD || 'AdminSecretPassword123!' }}
        run: |
          uv run python scripts/smoke_test.py --url "${DEPLOY_URL}" --email "${SMOKE_USER}" --password "${SMOKE_PASSWORD}"
