name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Style Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1643c72a819c9eeb135f606346743ae841bc6838 # v5.1.0
        with:
          enable-cache: true
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --group dev --group core

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Import linter architecture contracts
        run: uv run lint-imports

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1643c72a819c9eeb135f606346743ae841bc6838 # v5.1.0
        with:
          enable-cache: true
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install all dependencies for typing
        run: uv sync --frozen --all-groups

      - name: Run mypy
        run: uv run mypy src tests

  test-and-coverage:
    name: Test & Coverage Gate (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retailpulse
          POSTGRES_PASSWORD: retailpulse_password
          POSTGRES_DB: retailpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U retailpulse -d retailpulse_test
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      RP_DATABASE_URL: postgresql+psycopg://retailpulse:retailpulse_password@localhost:5432/retailpulse_test
      RP_ENV: test
      RP_AUTO_PROMOTE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1643c72a819c9eeb135f606346743ae841bc6838 # v5.1.0
        with:
          enable-cache: true
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install all dependencies
        run: uv sync --frozen --all-groups

      - name: Run database migrations on test database
        run: uv run alembic upgrade head

      - name: Run unit & integration tests with branch coverage
        run: >-
          uv run pytest
          --cov=src/retailpulse
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          tests/

      - name: Enforce per-module coverage thresholds (TESTING §6)
        run: |
          echo "Checking security coverage (>= 95%)..."
          uv run coverage report --include="src/retailpulse/security/*,src/retailpulse/ml/inventory/policy.py" --fail-under=95

          echo "Checking core ETL, features, ML math coverage (>= 90%)..."
          uv run coverage report --include="src/retailpulse/etl/*,src/retailpulse/features/*,src/retailpulse/ml/forecasting/metrics.py,src/retailpulse/ml/forecasting/backtest.py,src/retailpulse/ml/forecasting/intervals.py" --fail-under=90

          echo "Checking API coverage (>= 85%)..."
          uv run coverage report --include="src/retailpulse/api/*" --fail-under=85

          echo "Checking pipelines coverage (>= 75%)..."
          uv run coverage report --include="src/retailpulse/pipelines/*" --fail-under=75

          echo "Checking dashboard coverage (>= 60%)..."
          uv run coverage report --include="src/retailpulse/dashboard/*" --fail-under=60
