name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly every Monday at 04:00 UTC
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-dependencies:
    name: SAST & Dependency Audit (bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1643c72a819c9eeb135f606346743ae841bc6838 # v5.1.0
        with:
          enable-cache: true
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --group dev --group core

      - name: Run bandit SAST (medium and above)
        run: uv run bandit -r src/ -ll

      - name: Run pip-audit on dependencies
        run: uv run pip-audit

  gitleaks:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e33a2512f45f5a894a45a33604f86d63428df13b # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: infra/docker/api.Dockerfile
            image: retailpulse-api:test
          - dockerfile: infra/docker/dashboard.Dockerfile
            image: retailpulse-dashboard:test
          - dockerfile: infra/docker/worker.Dockerfile
            image: retailpulse-worker:test
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build local container image
        run: |
          docker build -t ${{ matrix.image }} -f ${{ matrix.dockerfile }} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ matrix.image }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
