  RP_ENABLE_DOCS: "false"
  RP_LOG_LEVEL: "INFO"
  RP_CURRENCY: "GBP"
  RP_SEED: "42"
  RP_PIPELINE_TRIGGER: "prefect"
  RP_AUTO_PROMOTE: "false"
  RP_CORS_ORIGINS: "http://localhost:8501,http://localhost:8000"
