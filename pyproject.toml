[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retailpulse"
version = "0.1.0"
description = "AI-powered customer analytics and demand forecasting platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "typer>=0.12.0",
]

[project.scripts]
retailpulse = "retailpulse.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "import-linter>=2.0",
    "pre-commit>=3.7.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "types-openpyxl",
    "types-pyyaml",
]
core = [
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.2",
    "pandera>=0.19.0",
    "sqlalchemy>=2.0.29",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "holidays>=0.45",
    "scipy>=1.12.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "slowapi>=0.1.9",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]
dashboard = [
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
    "httpx>=0.27.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "statsmodels>=0.14.1",
    "prophet>=1.1.5",
    "torch>=2.2.0",
    "shap>=0.45.0",
    "mlflow>=2.12.0",
    "prefect>=3.0.0",
    "evidently>=0.4.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retailpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "PD", "NPY",
    "PL", "T20", "DTZ", "PT", "ARG", "ANN", "TID", "ERA"
]
ignore = ["ANN401", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "ARG", "PLR2004", "S105", "S106"]
"scripts/**" = ["T20", "PLR0915", "S311", "DTZ001"]
"migrations/**" = ["N999", "ANN"]
"src/retailpulse/timeutil.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use retailpulse.timeutil.utc_now() (system code only) or pass as_of."
"datetime.datetime.utcnow".msg = "Use retailpulse.timeutil.utc_now()."
"datetime.date.today".msg = "ML, feature and ETL logic must take as_of; never read the clock."

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "prophet.*", "lightgbm.*", "shap.*", "mlflow.*", "evidently.*", "plotly.*",
    "streamlit.*", "holidays.*", "sklearn.*", "scipy.*", "statsmodels.*", "torch.*",
    "pandera.*", "slowapi.*", "prefect.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "unit: fast tests without external services",
    "integration: needs PostgreSQL",
    "e2e: needs the full compose stack",
    "ml: trains small models",
    "slow: takes more than 10 seconds",
]

[tool.coverage.run]
source = ["src/retailpulse"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "retailpulse"

[[tool.importlinter.contracts]]
name = "Package layers"
type = "layers"
ignore_missing_layers = true
layers = [
    "retailpulse.dashboard",
    "retailpulse.api",
    "retailpulse.pipelines",
    "retailpulse.monitoring",
    "retailpulse.ml",
    "retailpulse.features",
    "retailpulse.etl",
    "retailpulse.ingestion",
    "retailpulse.security",
    "retailpulse.db",
    "retailpulse.logging",
    "retailpulse.config",
    "retailpulse.errors",
]

[[tool.importlinter.contracts]]
name = "Clock isolation"
type = "forbidden"
source_modules = [
    "retailpulse.ml",
    "retailpulse.features",
    "retailpulse.etl",
]
forbidden_modules = [
    "retailpulse.timeutil",
]
